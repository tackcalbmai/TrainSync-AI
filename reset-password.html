<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Reset password · TrainSync AI</title>
  <style>
    .recovery-shell{min-height:100vh;display:grid;place-items:center;padding:28px}.recovery-card{width:min(480px,100%);border:1px solid var(--line-strong);background:linear-gradient(145deg,rgba(23,28,32,.98),rgba(13,16,18,.98));border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.recovery-card h1{font-size:34px;letter-spacing:-.05em;margin:15px 0 10px}.recovery-card>p{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 24px}.recovery-form{display:grid;gap:14px}.recovery-form label{display:grid;gap:7px;color:var(--muted);font-size:9px;letter-spacing:.09em;font-weight:800}.recovery-form input{height:46px;border:1px solid var(--line-strong);border-radius:10px;background:rgba(255,255,255,.025);color:var(--text);padding:0 13px;outline:none}.recovery-form input:focus{border-color:rgba(200,255,53,.45)}.recovery-form button{height:46px;border:0;border-radius:10px;background:var(--accent);color:#090b0d;font-size:9px;letter-spacing:.11em;font-weight:950;cursor:pointer}.recovery-form button:disabled{opacity:.5;cursor:wait}.recovery-state{min-height:20px;margin-top:14px;color:var(--muted);font-size:9px;line-height:1.5}.recovery-state.ok{color:var(--accent)}.recovery-back{display:inline-flex;margin-top:20px;color:var(--muted);font-size:9px;letter-spacing:.1em;text-decoration:none;font-weight:800}.recovery-back:hover{color:var(--accent)}
  </style>
</head>
<body>
  <div class="noise"></div>
  <main class="recovery-shell">
    <section class="recovery-card">
      <a class="brand" href="/" aria-label="TrainSync AI home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><b>TRAINSYNC</b><em>AI</em></span></a>
      <div class="eyebrow" style="margin-top:30px"><span></span> ACCOUNT SECURITY</div>
      <h1>Choose a new password.</h1>
      <p>This page only accepts a valid password-recovery session. After the password is changed, TrainSync signs the browser out so you can sign in again with the new password.</p>
      <form class="recovery-form" id="recoveryForm">
        <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button id="recoverySubmit" type="submit">UPDATE PASSWORD</button>
      </form>
      <div class="recovery-state" id="recoveryState" role="status" aria-live="polite"></div>
      <a class="recovery-back" href="/">← BACK TO TRAIN</a>
    </section>
  </main>
  <script type="module" src="/reset-password.js"></script>
</body>
</html>
